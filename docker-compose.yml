# Local Development Docker Compose
# Includes PostgreSQL and Keycloak for complete local testing

services:
  # PostgreSQL Database
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kurumsalindirim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kurumsalindirim"]
      interval: 10s
      retries: 5
      start_period: 30s

  # Keycloak for local authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend API
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PostgreSQL
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kurumsalindirim
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Keycloak
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=master
      - KEYCLOAK_CLIENT_ID=kurumsalindirim
      - KEYCLOAK_CLIENT_SECRET=
      # Application
      - SECRET_KEY=local-dev-secret-key-min-32-chars
      - ENVIRONMENT=local
      - PROJECT_NAME=Kurumsal Indirim
      - FRONTEND_HOST=http://localhost:5173
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (production build with nginx)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_KEYCLOAK_URL=http://localhost:8081
        - VITE_KEYCLOAK_REALM=master
        - VITE_KEYCLOAK_CLIENT_ID=kurumsalindirim
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Adminer for database management
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  postgres-data: